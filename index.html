<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SaltSense – Seasoning & Brine Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="SaltSense helps chefs accurately calculate salt for seasoning, brines, and recipe scaling. No more guessing, just precise seasoning.">
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <script defer src="assets/app.js"></script>
</head>
<body>
  <header class="ss-header">
    <div class="ss-header-inner">
      <h1>SaltSense</h1>
      <p>Stop guessing. Start seasoning with precision.</p>
    </div>
  </header>

  <main class="ss-main">
    <nav class="ss-nav">
      <button class="ss-tab-btn active" data-target="general">General Seasoning</button>
      <button class="ss-tab-btn" data-target="brine">Brine / Pickling</button>
      <button class="ss-tab-btn" data-target="scaling">Recipe Scaling</button>
    </nav>

    <!-- General Seasoning -->
    <section id="general" class="ss-card ss-card-active">
      <h2>General Seasoning Calculator</h2>
      <div class="ss-field-row">
        <label for="foodWeight">Food weight</label>
        <div class="ss-inline-input">
          <input type="number" id="foodWeight" min="1" step="1" placeholder="e.g. 850">
          <span class="ss-unit">g</span>
        </div>
      </div>

      <div class="ss-field-row">
        <label>Salt intensity</label>
        <div class="ss-chip-row">
          <button class="ss-chip ss-chip-intensity active" data-percent="1.0">Light (1.0%)</button>
          <button class="ss-chip ss-chip-intensity" data-percent="1.5">Medium (1.5%)</button>
          <button class="ss-chip ss-chip-intensity" data-percent="2.0">Bold (2.0%)</button>
        </div>
      </div>

      <div class="ss-field-row">
        <label for="saltTypeGeneral">Salt type</label>
        <select id="saltTypeGeneral">
          <option value="table">Fine table salt</option>
          <option value="kosher">Kosher salt</option>
          <option value="sea">Coarse sea salt</option>
        </select>
      </div>

      <button id="calcGeneral" class="ss-primary-btn">Calculate</button>

      <div id="generalResult" class="ss-result"></div>
    </section>

    <!-- Brine -->
    <section id="brine" class="ss-card">
      <h2>Brine / Pickling Calculator</h2>

      <div class="ss-field-row">
        <label for="waterAmount">Water amount</label>
        <div class="ss-inline-input">
          <input type="number" id="waterAmount" min="1" step="1" placeholder="e.g. 2000">
          <span class="ss-unit">ml</span>
        </div>
      </div>

      <div class="ss-field-row">
        <label for="brinePercent">Brine strength (%)</label>
        <div class="ss-inline-input">
          <input type="number" id="brinePercent" min="0.5" max="20" step="0.1" placeholder="e.g. 6">
          <span class="ss-unit">%</span>
        </div>
        <p class="ss-hint">
          2–3% light | 5–8% brine | 8–12% strong pickling
        </p>
      </div>

      <div class="ss-field-row">
        <label for="saltTypeBrine">Salt type</label>
        <select id="saltTypeBrine">
          <option value="table">Fine table salt</option>
          <option value="kosher">Kosher salt</option>
          <option value="sea">Coarse sea salt</option>
        </select>
      </div>

      <button id="calcBrine" class="ss-primary-btn">Calculate</button>

      <div id="brineResult" class="ss-result"></div>
    </section>

    <!-- Recipe Scaling -->
    <section id="scaling" class="ss-card">
      <h2>Recipe & Salt Scaling</h2>

      <div class="ss-field-row">
        <label for="origTotal">Original total (weight or portions)</label>
        <input type="number" id="origTotal" min="0.1" step="0.1" placeholder="e.g. 10">
      </div>

      <div class="ss-field-row">
        <label for="origSalt">Original salt amount (g)</label>
        <input type="number" id="origSalt" min="0" step="0.1" placeholder="e.g. 12">
      </div>

      <div class="ss-field-row">
        <label for="newTotal">New total (weight or portions)</label>
        <input type="number" id="newTotal" min="0.1" step="0.1" placeholder="e.g. 35">
      </div>

      <button id="calcScaling" class="ss-primary-btn">Calculate</button>

      <div id="scalingResult" class="ss-result"></div>
    </section>
  </main>

  <footer class="ss-footer">
    <p>SaltSense – precision seasoning for real kitchens.</p>
  </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SaltSense – Precision Seasoning Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="SaltSense calculates precise grams of salt for seasoning, brines, and recipe scaling. No spoons — just real chef precision.">

  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="16x16" href="assets/SALT-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/SALT-32x32.png">
  <link rel="shortcut icon" href="assets/SALT-32x32.png">

  <!-- Banner Logo -->
  <link rel="preload" as="image" href="assets/saltsense-banner.png">

  <link rel="stylesheet" href="assets/styles.css">
  <script defer src="assets/app.js"></script>
</head>

<body>
  <!-- HEADER WITH LOGO -->
  <header class="ss-header">
    <div class="ss-header-inner" style="display:flex;align-items:center;justify-content:center;">
      <img src="assets/saltsense-banner.png"
           alt="SaltSense Logo"
           style="height:130px;width:630px;object-fit:contain;">
    </div>
  </header>

  <main class="ss-main">

    <!-- NAV TABS -->
    <nav class="ss-nav">
      <button class="ss-tab-btn active" data-target="general">General Seasoning</button>
      <button class="ss-tab-btn" data-target="brine">Brine / Pickling</button>
      <button class="ss-tab-btn" data-target="scaling">Recipe Scaling</button>
    </nav>

    <!-- ============================= -->
    <!-- GENERAL SEASONING SECTION     -->
    <!-- ============================= -->
    <section id="general" class="ss-card ss-card-active">
      <h2>General Seasoning</h2>

      <!-- PRESETS -->
      <div class="ss-field-row">
        <label>Presets</label>
        <div class="ss-chip-row">
          <button class="ss-chip ss-preset-general" data-intensity="1.2">Chicken (1.2%)</button>
          <button class="ss-chip ss-preset-general" data-intensity="1.7">Steak (1.7%)</button>
          <button class="ss-chip ss-preset-general" data-intensity="1.0">Vegetables (1.0%)</button>
          <button class="ss-chip ss-preset-general" data-intensity="1.4">Sauce (1.4%)</button>
        </div>
      </div>

      <div class="ss-field-row">
        <label for="foodWeight">Food weight</label>
        <div class="ss-inline-input">
          <input type="number" id="foodWeight" min="1" step="1" placeholder="e.g. 850">
          <span class="ss-unit">g</span>
        </div>
      </div>

      <div class="ss-field-row">
        <label>Salt intensity</label>
        <div class="ss-chip-row">
          <button class="ss-chip ss-chip-intensity" data-percent="1.0">Light (1.0%)</button>
          <button class="ss-chip ss-chip-intensity" data-percent="1.5">Medium (1.5%)</button>
          <button class="ss-chip ss-chip-intensity" data-percent="2.0">Bold (2.0%)</button>
        </div>
      </div>

      <div class="ss-field-row">
        <label for="saltTypeGeneral">Salt type (note only)</label>
        <select id="saltTypeGeneral">
          <option value="fine">Fine salt (fast)</option>
          <option value="kosher">Kosher salt (mild)</option>
          <option value="sea">Coarse sea salt (slow)</option>
        </select>
      </div>

      <button id="calcGeneral" class="ss-primary-btn">Calculate</button>
      <div id="generalResult" class="ss-result"></div>
    </section>

    <!-- ============================= -->
    <!-- BRINE SECTION                 -->
    <!-- ============================= -->
    <section id="brine" class="ss-card">
      <h2>Brine / Pickling</h2>

      <!-- BRINE PRESETS -->
      <div class="ss-field-row">
        <label>Presets</label>
        <div class="ss-chip-row">
          <button class="ss-chip ss-preset-brine" data-percent="3">Light (3%)</button>
          <button class="ss-chip ss-preset-brine" data-percent="6">Poultry (6%)</button>
          <button class="ss-chip ss-preset-brine" data-percent="10">Pickling (10%)</button>
        </div>
      </div>

      <div class="ss-field-row">
        <label for="waterAmount">Water amount</label>
        <div class="ss-inline-input">
          <input type="number" id="waterAmount" min="1" step="1" placeholder="e.g. 2000">
          <span class="ss-unit">ml</span>
        </div>
      </div>

      <div class="ss-field-row">
        <label for="brinePercent">Brine strength (%)</label>
        <div class="ss-inline-input">
          <input type="number" id="brinePercent" min="0.5" max="20" step="0.1" placeholder="e.g. 6">
          <span class="ss-unit">%</span>
        </div>
        <p class="ss-hint">2–3% light · 5–8% poultry · 8–12% pickling</p>
      </div>

      <div class="ss-field-row">
        <label for="saltTypeBrine">Salt type (note only)</label>
        <select id="saltTypeBrine">
          <option value="fine">Fine salt</option>
          <option value="kosher">Kosher salt</option>
          <option value="sea">Sea salt</option>
        </select>
      </div>

      <button id="calcBrine" class="ss-primary-btn">Calculate</button>
      <div id="brineResult" class="ss-result"></div>
    </section>

    <!-- ============================= -->
    <!-- RECIPE SCALING                -->
    <!-- ============================= -->
    <section id="scaling" class="ss-card">
      <h2>Recipe Scaling</h2>

      <div class="ss-field-row">
        <label for="origTotal">Original total (g or portions)</label>
        <input type="number" id="origTotal" min="0.1" step="0.1" placeholder="e.g. 10">
      </div>

      <div class="ss-field-row">
        <label for="origSalt">Original salt (g)</label>
        <input type="number" id="origSalt" min="0" step="0.1" placeholder="e.g. 12">
      </div>

      <div class="ss-field-row">
        <label for="newTotal">New total (g or portions)</label>
        <input type="number" id="newTotal" min="0.1" step="0.1" placeholder="e.g. 35">
      </div>

      <button id="calcScaling" class="ss-primary-btn">Calculate</button>
      <div id="scalingResult" class="ss-result"></div>
    </section>

  </main>

  <footer class="ss-footer">
    <p>SaltSense — precise seasoning for real kitchens.</p>
  </footer>

</body>
</html>
